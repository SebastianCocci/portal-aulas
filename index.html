<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Aulas UAI</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>UAI</h1>
            <p>Portal de Aulas y Exámenes</p>
        </div>

        <div class="botones">

            <button id="btnClases" class="activo">
                CURSADO
            </button>

            <button id="btnExamenes">
                EXÁMENES
            </button>

        </div>
        <select id="filtroFecha" style="display:none;">
            <option value="">Todas las fechas</option>
        </select>

        <input
            type="text"
            id="busqueda"
            placeholder="Escribí el nombre de tu materia..."
        >

        <div id="resultados"></div>

    </div>

    <script src="app.js"></script>

</body>

</html>
